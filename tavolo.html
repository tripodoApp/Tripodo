<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gioco di Carte - Luxury Table</title>
  <style>
    /* RESET E BASE */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

    body {
      height: 100vh;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* AREA DI GIOCO CIRCOLARE */
    .game-container {
      position: relative;
      width: 800px;
      height: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* IL TAVOLO VERDE */
    .table {
      width: 450px;
      height: 450px;
      background: radial-gradient(#2e7d32, #1b5e20);
      border-radius: 50%;
      border: 12px solid #3e2723;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    /* CARTE SUL TAVOLO (Centro) */
    #table-cards {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* CONTENITORI GIOCATORI */
    .player {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      transition: all 0.5s ease;
    }

    .hand {
      display: flex;
      gap: -10px; /* sovrapposizione leggera */
    }

    /* CARTE */
    .card {
      width: 70px;
      height: auto;
      border-radius: 5px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* EFFETTI AVVERSARI (Ventaglio) */
    .opponent .card {
        margin-left: -35px;
    }
    .opponent .card:first-child { margin-left: 0; }

    /* IL MIO LAYOUT (In basso, dritto) */
    .me {
      bottom: 40px;
      flex-direction: column-reverse;
    }

    .me .hand {
        gap: 10px;
    }

    .me .card:hover {
      transform: translateY(-20px) scale(1.1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.8);
      z-index: 10;
    }

    /* CONTROLLI */
    .controls {
      margin-top: 15px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 8px;
      display: flex;       /* Allinea i figli in riga */
  align-items: center; /* Allinea verticalmente al centro */
  gap: 10px;
    }

    .controls form {
  display: flex;       /* Allinea input e bottone conferma in riga */
  align-items: center;
  gap: 5px;            /* Spazio tra input e bottone conferma */
  margin: 0;           /* Rimuove margini predefiniti del form */
}

    input { width: 60px; padding: 8px; border-radius: 4px; border: none; text-align: center; }
    button { padding: 8px 15px; cursor: pointer; background: #f1c40f; border: none; border-radius: 4px; font-weight: bold; }

    /* LOG */
    #game-log {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 250px;
      max-height: 150px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 12px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
    }

    /* Custom per la tabella punteggi */
.table-modal {
  width: 80% !important; /* Più larga per ospitare la tabella */
  max-width: 600px;
  max-height: 80vh;
  overflow-y: auto;
}

.table-container {
  margin-top: 10px;
  overflow-x: auto; /* Scroll orizzontale se ci sono molti giocatori */
  background: rgba(0,0,0,0.5);
  border-radius: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  color: white;
}

th, td {
  padding: 12px;
  border: 1px solid rgba(241, 196, 15, 0.3);
  text-align: center;
}

th {
  background-color: #f1c40f;
  color: #1a1a1a;
  text-transform: uppercase;
  font-size: 0.9em;
}

tr:nth-child(even) {
  background: rgba(255,255,255,0.05);
}

/* Evidenzia l'ultimo round */
tr:last-child {
  border-bottom: 2px solid #f1c40f;
}

/*FINESTRA MODALE*/
/* Lo sfondo della modale (copre tutto lo schermo) */
.modal {
  display: none; /* Nascosta di default */
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.5); /* Sfondo semi-trasparente */
}

/* Il rettangolo bianco centrale */
.modal-content {
  background-color: white;
  margin: 15% auto;
  padding: 20px;
  border-radius: 8px;
  width: 50%; /* Larghezza della finestra */
  max-width: 400px;
  position: relative;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

/* Il tasto di chiusura (X) */
.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 24px;
  cursor: pointer;
}
  </style>
</head>
<body>

  <div class="game-container">
    
    <div class="player opponent" id="opponent-container">
      <div class="hand" id="handOpponent"></div>
    </div>

    <div class="table">
      <div id="table-cards"></div>
    </div>
  

<div id="modalPunteggio" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
      <div class="table-container">
        <table id="scoreTable">
          <thead>
            <tr id="tableHeader">
              </tr>
          </thead>
          <tbody id="tableBody">
            </tbody>
        </table>
    </div>
  </div>
</div>

    <div class="player me">
      <div class="controls">
        <button id="btnPunteggio">Punteggio</button>
        <form>
          <input id="callInput" placeholder="N°" pattern="[0-9]" type="text" inputmode="numeric" maxlength="1" required>
          <button id="callBtn" type="button">Conferma</button>
        </form>
      </div>
      <div class="hand" id="my-hand"></div>
    </div>

  </div>

  <div id="game-log"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
  <script>
    const socket = io();
    const playerId = localStorage.getItem('playerId');
    socket.emit('tableReady', playerId);

    const handOpponent = document.getElementById('handOpponent');
    const myHand = document.getElementById('my-hand');
    const table = document.getElementById('table-cards');
    const callInput = document.getElementById('callInput');
    const callBtn = document.getElementById('callBtn');
    const gameLog = document.getElementById('game-log');
    const modal = document.getElementById("modalPunteggio");
    const btn = document.getElementById("btnPunteggio");
    const span = document.querySelector(".close-btn");

    //MODALE PUNTEGGIo 
    btn.onclick = function() {
  modal.style.display = "block";
}

// Chiude la modale cliccando sulla X
span.onclick = function() {
  modal.style.display = "none";
}

// Chiude la modale cliccando in un punto qualsiasi fuori dal rettangolo bianco
window.onclick = function(event) {
  if (event.target == modal) {
    modal.style.display = "none";
  }
}

    // FUNZIONE PER POSIZIONARE GLI AVVERSARI A CERCHIO
    // Nota: in questo esempio gestiamo 1 avversario fisso in alto, 
    // ma la logica è pronta per espandersi.
    function adjustLayout() {
        const oppContainer = document.getElementById('opponent-container');
        // Se hai più avversari, qui dovresti ciclare e calcolare sin/cos come nell'esempio precedente.
        // Per ora manteniamo l'avversario standard "di fronte" (Top)
        oppContainer.style.top = "40px";
    }

    // socket.on('initData', (playerData, gameState) => {
    //   myHand.innerHTML = '';
    //   table.innerHTML = '';
    //   handOpponent.innerHTML = '';

    //   // CARTE SUL TAVOLO
    //   gameState.cardsTable.forEach(card => {
    //     const img = document.createElement('img');
    //     img.src = `./img/cards/Napoletane/${card.carta}.jpg`;
    //     img.classList.add('card');
    //     img.addEventListener('click', () => {
    //       socket.emit('playCard', card, playerId);
    //     });
    //     table.appendChild(img);
    //   });

    //   // LE MIE CARTE
    //   playerData.cardsHands.forEach(card => {
    //     const img = document.createElement('img');
    //     img.src = `./img/cards/Napoletane/${card.carta}.jpg`;
    //     img.classList.add('card');
    //     img.addEventListener('click', () => {
    //       socket.emit('playCard', card, playerId);
    //     });
    //     myHand.appendChild(img);
    //   });

    //   // CARTE AVVERSARIO (Dorso)
    //   // Usiamo le tue carte per sapere quante ne ha l'avversario (logica esistente)
    //   playerData.cardsHands.forEach(() => {
    //     const img = document.createElement('img');
    //     img.src = `./img/cards/Napoletane/bg.jpg`;
    //     img.classList.add('card');
    //     handOpponent.appendChild(img);
    //   });

    //   adjustLayout();
    // });

    socket.on('initData', (playerData, gameState, players) => {
    // 1. Pulizia totale
    const container = document.querySelector('.game-container');
    // Rimuovi tutti i vecchi player tranne quello locale se preferisci, 
    // ma resettare tutto è più sicuro:
    document.querySelectorAll('.player.opponent').forEach(el => el.remove());
    myHand.innerHTML = '';
    table.innerHTML = '';

    // 2. CARTE SUL TAVOLO (Centro)
    gameState.cardsTable.forEach(card => {
        const img = document.createElement('img');
        img.src = `./img/cards/Napoletane/${card.carta}.jpg`;
        img.classList.add('card');
        table.appendChild(img);
    });

    // 3. LE MIE CARTE (Sempre fisse in basso)
    playerData.cardsHands.forEach(card => {
        const img = document.createElement('img');
        img.src = `./img/cards/Napoletane/${card.carta}.jpg`;
        img.classList.add('card');
        img.onclick = () => socket.emit('playCard', card, playerId);
        myHand.appendChild(img);
    });

    // 4. POSIZIONAMENTO AVVERSARI A CERCHIO
    // Supponiamo che gameState.allPlayers sia la lista di tutti gli ID al tavolo
    const avversari = players.filter(player => player.playerId !== playerId);
    const numAvversari = avversari.length;
    
    const raggio = 280; // Distanza dal centro tavolo
    const centerX = container.offsetWidth / 2;
    const centerY = container.offsetHeight / 2;

    avversari.forEach((advId, index) => {
        // Calcoliamo l'angolo: distribuiamo gli avversari nell'arco superiore (da 180° a 360°)
        // In questo modo nessuno si sovrappone a TE che sei a 90° (in basso)
        const startAngle = Math.PI; // Inizia da sinistra
        const endAngle = 2 * Math.PI; // Finisce a destra
        const angle = startAngle + (index * (endAngle - startAngle) / (numAvversari - 1 || 1));

        const x = centerX + raggio * Math.cos(angle) - 50; 
        const y = centerY + raggio * Math.sin(angle) - 50;

        // Crea il div dell'avversario
        const divOpp = document.createElement('div');
        divOpp.className = 'player opponent';
        divOpp.style.left = `${x}px`;
        divOpp.style.top = `${y}px`;
        
        // Ruota il contenitore verso il centro
        const rotation = (angle * 180 / Math.PI) - 270;
        divOpp.style.transform = `rotate(${rotation}deg)`;

        // Aggiungi le carte coperte (es. 3 carte)
        const handDiv = document.createElement('div');
        handDiv.className = 'hand';
        playerData.cardsHands.forEach(() => {
        const cardBack = document.createElement('img');
            cardBack.src = `./img/cards/Napoletane/bg.jpg`;
            cardBack.classList.add('card');
            handDiv.appendChild(cardBack);
      });

        // Etichetta col nome/ID
        const label = document.createElement('div');
        label.className = 'label';
        label.innerText = `Giocatore ${index + 2}`;
        label.style.transform = `rotate(${-rotation}deg)`; // Raddrizza il testo

        divOpp.appendChild(handDiv);
        divOpp.appendChild(label);
        container.appendChild(divOpp);
    });

});

    socket.on('gameLog', (message) => {
      const row = document.createElement('div');
      row.textContent = message;
      gameLog.appendChild(row);
      gameLog.scrollTop = gameLog.scrollHeight;
    });

    socket.on('cardOnTable', ({ card }) => {
      const img = document.createElement('img');
      img.src = `./img/cards/Napoletane/${card.carta}.jpg`;
      img.classList.add('card');
      table.appendChild(img);
    });

    socket.on('finePlayCard', () => {
      socket.emit("aggiornaDati", playerId);
    });

    socket.on('chiamataFatta', () => {
      socket.emit('handshakeChiamata', playerId);
    });

    socket.on('lastRound', () => {

      socket.emit('prepareLastRound', playerId);
    } )

    socket.on('chiamataBanco', (valoreNegato) => {
      if (valoreNegato != -1) {
        callInput.pattern = `[1-${valoreNegato - 1}${valoreNegato + 1}-9]`;
      }
    });

    socket.on('updateScores', data => {
    updateScoreTable(data.players, data.punteggi);
});

    function updateScoreTable(players, punteggi) {
      const header = document.getElementById('tableHeader');
      const body = document.getElementById('tableBody');

      // 1. Pulizia
      header.innerHTML = '<th>Round</th>'; 
      body.innerHTML = '';

      // 2. Intestazione: Nomi dei giocatori
      players.forEach(p => {
        const th = document.createElement('th');
        th.textContent = p.playerName;
        header.appendChild(th);
      });

      // 3. Calcoliamo quanti round sono stati fatti (lunghezza del primo array di punteggi)
      // Usiamo l'ID del primo giocatore per capire il numero di round
      const primoPlayerId = players[0].playerId;
      const numeroRound = punteggi[primoPlayerId] ? punteggi[primoPlayerId].length : 0;

    // 4. Creiamo le righe per ogni round
      for (let i = 0; i < numeroRound; i++) {
        const tr = document.createElement('tr');
        
        // Colonna Numero Round
        const tdIndex = document.createElement('td');
        tdIndex.textContent = i + 1;
        tr.appendChild(tdIndex);

        // Colonne Punteggi Giocatori
        players.forEach(p => {
            const tdScore = document.createElement('td');
            // Accediamo all'i-esimo elemento dell'array di quel giocatore
            const score = punteggi[p.playerId][i];
            tdScore.textContent = score !== undefined ? score : '-';
            tr.appendChild(tdScore);
        });

        body.appendChild(tr);
    }

    // 5. RIGA TOTALI (Opzionale ma molto utile)
    const trTotale = document.createElement('tr');
    trTotale.style.background = 'rgba(241, 196, 15, 0.2)'; // Evidenziato oro
    trTotale.innerHTML = '<td><strong>TOT</strong></td>';
    
    players.forEach(p => {
        const tdTotal = document.createElement('td');
        const totale = punteggi[p.playerId].reduce((a, b) => a + b, 0);
        tdTotal.innerHTML = `<strong>${totale}</strong>`;
        trTotale.appendChild(tdTotal);
    });
    body.appendChild(trTotale);
}



    socket.on('cardsLastRound', (playerData, gameState, players, carte) => {
    // 1. Pulizia totale
    const container = document.querySelector('.game-container');
    // Rimuovi tutti i vecchi player tranne quello locale se preferisci, 
    // ma resettare tutto è più sicuro:
    document.querySelectorAll('.player.opponent').forEach(el => el.remove());
    myHand.innerHTML = '';
    table.innerHTML = '';

    // 2. CARTE SUL TAVOLO (Centro)
    gameState.cardsTable.forEach(card => {
        const img = document.createElement('img');
        img.src = `./img/cards/Napoletane/${card.carta}.jpg`;
        img.classList.add('card');
        table.appendChild(img);
    });

    // 3. LE MIE CARTE (Sempre fisse in basso)
      const card = { carta : "last", valore: "last", idPlayer : playerData.idPlayer };
        const img = document.createElement('img');
        img.src = `./img/cards/Napoletane/bg.jpg`;
        img.classList.add('card');
        img.onclick = () => socket.emit('playCard', card, playerId);
        myHand.appendChild(img);
    

    // 4. POSIZIONAMENTO AVVERSARI A CERCHIO
    // Supponiamo che gameState.allPlayers sia la lista di tutti gli ID al tavolo
    const avversari = players.filter(player => player.playerId !== playerId);
    const numAvversari = avversari.length;
    
    const raggio = 280; // Distanza dal centro tavolo
    const centerX = container.offsetWidth / 2;
    const centerY = container.offsetHeight / 2;

    avversari.forEach((advId, index) => {
        // Calcoliamo l'angolo: distribuiamo gli avversari nell'arco superiore (da 180° a 360°)
        // In questo modo nessuno si sovrappone a TE che sei a 90° (in basso)
        const startAngle = Math.PI; // Inizia da sinistra
        const endAngle = 2 * Math.PI; // Finisce a destra
        const angle = startAngle + (index * (endAngle - startAngle) / (numAvversari - 1 || 1));

        const x = centerX + raggio * Math.cos(angle) - 50; 
        const y = centerY + raggio * Math.sin(angle) - 50;

        // Crea il div dell'avversario
        const divOpp = document.createElement('div');
        divOpp.className = 'player opponent';
        divOpp.style.left = `${x}px`;
        divOpp.style.top = `${y}px`;
        
        // Ruota il contenitore verso il centro
        const rotation = (angle * 180 / Math.PI) - 270;
        divOpp.style.transform = `rotate(${rotation}deg)`;

        // Aggiungi le carte coperte dell'avversario oppure IN QUESTO CASO
        //ultimo giro scoperto
        const handDiv = document.createElement('div');
        carte.forEach( carta => {

          if ( carta.idPlayer === advId.playerId ) {

            handDiv.className = 'hand';
            
              const card = document.createElement('img');
              card.src = `./img/cards/Napoletane/${carta.carta}.jpg`;
              card.classList.add('card');
              handDiv.appendChild(card);
            
          }
        });

        // Etichetta col nome/ID
        const label = document.createElement('div');
        label.className = 'label';
        label.innerText = `Giocatore ${index + 2}`;
        label.style.transform = `rotate(${-rotation}deg)`; // Raddrizza il testo

        divOpp.appendChild(handDiv);
        divOpp.appendChild(label);
        container.appendChild(divOpp);
    });
});


    callBtn.addEventListener('click', (event) => {
      event.preventDefault();
      const value = Number(callInput.value);
      socket.emit('callNumber', value, playerId);
    });

    window.onload = adjustLayout;
  </script>
</body>
</html>
