<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Gioco di Carte - Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="public\homeComponent\styleHome.css" />
  </head>
  <body>
    <div class="container">
      <h1>Tripodo</h1>
      <button id="createBtn">Crea Partita</button>
      <button id="joinBtn">Unisciti a Partita</button>
    </div>

    <!-- MODALE -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>

        <div id="createRoomSection" class="modal-section hidden">
          <h2>Crea Partita</h2>
          <input type="text" id="roomNameInput" placeholder="Nome partita" />
          <input type="text" id="myNameInput" placeholder="Il tuo nome" />
          <button id="createRoomBtn">Crea</button>
          <div id="playerListCreate"></div>
          <button id="startGameBtn" class="hidden">Avvia Partita</button>
          <button id="startGameTest" class="hidden">Avvia Partita Test</button>
        </div>

        <div id="joinRoomSection" class="modal-section hidden">
          <h2>Unisciti a Partita</h2>
          <input type="text" id="joinRoomInput" placeholder="Nome partita" />
          <input type="text" id="myNameInput2" placeholder="Il tuo nome" />
          <button id="joinRoomBtn">Unisciti</button>
          <div id="playerListJoin"></div>
        </div>
      </div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"
      integrity="sha512-8BHxHDLsOHx+flIrQ0DrZcea7MkHqRU5GbTHmbdzMRnAaoCIkZ97PqZcXJkKZckMMhqfoeaJE+DNUVuyoQsO3Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script src="/public/homeComponent/scriptHome.js"></script>
  </body>
</html>
