<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Fine Partita - Risultati</title>
    <style>
        /* Inserisci qui il tuo CSS originale */
        /* ... (Body, game-container, table, etc.) ... */

        /* Adattamenti specifici per la schermata finale */
        body {
      height: 100vh;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* AREA DI GIOCO CIRCOLARE */
    .game-container {
      position: relative;
      width: 800px;
      height: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* IL TAVOLO VERDE */
    .table {
      width: 450px;
      height: 450px;
      background: radial-gradient(#2e7d32, #1b5e20);
      border-radius: 50%;
      border: 12px solid #3e2723;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    /* CARTE SUL TAVOLO (Centro) */
    #table-cards {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* CONTENITORI GIOCATORI */
    .player {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      transition: all 0.5s ease;
    }

    .hand {
      display: flex;
      gap: -10px; /* sovrapposizione leggera */
    }

    /* CARTE */
    .card {
      width: 70px;
      height: auto;
      border-radius: 5px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* EFFETTI AVVERSARI (Ventaglio) */
    .opponent .card {
        margin-left: -35px;
    }
    .opponent .card:first-child { margin-left: 0; }

    /* IL MIO LAYOUT (In basso, dritto) */
    .me {
      bottom: 40px;
      flex-direction: column-reverse;
    }

    .me .hand {
        gap: 10px;
    }

    .me .card:hover {
      transform: translateY(-20px) scale(1.1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.8);
      z-index: 10;
    }

    /* CONTROLLI */
    .controls {
      margin-top: 15px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 8px;
      display: flex;       /* Allinea i figli in riga */
  align-items: center; /* Allinea verticalmente al centro */
  gap: 10px;
    }

    .controls form {
  display: flex;       /* Allinea input e bottone conferma in riga */
  align-items: center;
  gap: 5px;            /* Spazio tra input e bottone conferma */
  margin: 0;           /* Rimuove margini predefiniti del form */
}

    input { width: 60px; padding: 8px; border-radius: 4px; border: none; text-align: center; }
    button { padding: 8px 15px; cursor: pointer; background: #f1c40f; border: none; border-radius: 4px; font-weight: bold; }

    /* LOG */
    #game-log {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 250px;
      max-height: 150px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 12px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
    }

    /* Custom per la tabella punteggi */
.table-modal {
  width: 80% !important; /* Più larga per ospitare la tabella */
  max-width: 600px;
  max-height: 80vh;
  overflow-y: auto;
}

.table-container {
  margin-top: 10px;
  overflow-x: auto; /* Scroll orizzontale se ci sono molti giocatori */
  background: rgba(0,0,0,0.5);
  border-radius: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  color: white;
}

th, td {
  padding: 12px;
  border: 1px solid rgba(241, 196, 15, 0.3);
  text-align: center;
}

th {
  background-color: #f1c40f;
  color: #1a1a1a;
  text-transform: uppercase;
  font-size: 0.9em;
}

tr:nth-child(even) {
  background: rgba(255,255,255,0.05);
}

/* Evidenzia l'ultimo round */
tr:last-child {
  border-bottom: 2px solid #f1c40f;
}

/*FINESTRA MODALE*/
/* Lo sfondo della modale (copre tutto lo schermo) */
.modal {
  display: none; /* Nascosta di default */
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.5); /* Sfondo semi-trasparente */
}

/* Il rettangolo bianco centrale */
.modal-content {
  background-color: white;
  margin: 15% auto;
  padding: 20px;
  border-radius: 8px;
  width: 50%; /* Larghezza della finestra */
  max-width: 400px;
  position: relative;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

/* Il tasto di chiusura (X) */
.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 24px;
  cursor: pointer;
}

        .winner-announcement {
            color: #f1c40f;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            z-index: 10;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .winner-name {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-display {
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #f1c40f;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.2);
            width: 90%;
            max-width: 500px;
            z-index: 5;
        }

        .home-button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.2rem;
            background: #f1c40f;
            color: #1a1a1a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .home-button:hover {
            background: #d4ac0d;
            transform: scale(1.05);
        }

        /* Sovrascrivo la tabella per renderla fissa e centrata */
        .game-over-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- <div class="table">
            <div class="winner-announcement">
                <p style="color: white; margin-bottom: 5px;">IL VINCITORE È</p>
                <h1 id="winner-name" class="winner-name">CARICAMENTO...</h1>
            </div>
        </div> -->

        <div class="player me" style="bottom: 10%; width: 100%; align-items: center; flex-direction: column;">

          <div class="winner-announcement">
                <p style="color: white; margin-bottom: 5px;">IL VINCITORE È</p>
                <h1 id="winner-name" class="winner-name">CARICAMENTO...</h1>
            </div>
            <div class="score-display">
                <div class="table-container">
                    <table id="scoreTable">
          <thead>
            <tr id="tableHeader">
              </tr>
          </thead>
          <tbody id="tableBody">
            </tbody>
        </table>
                </div>
            </div>
            
            <button class="home-button" onclick="goHome()">TORNA ALLA HOME</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const data = JSON.parse(sessionStorage.getItem('finalResults'));
        updateScoreTable(data.players, data.punteggi)
        // Funzione per il redirect alla home
        function goHome() {
            // Notifica il server che il giocatore sta lasciando la stanza definitivamente
            socket.emit('leave_game_final'); 
            window.location.href = '/'; // Redirect alla home
        }

        // // Esempio di ricezione dati finali (se non passati via URL/Query)
        // socket.on('game_results_data', (data) => {
        //     updateScoreTable(data.players, data.punteggi)
        //     // Qui invochi i tuoi metodi esistenti per popolare #scores-body
        //     // buildScoreTable(data.allScores);
        // });

        function updateScoreTable(players, punteggi) {
          const header = document.getElementById('tableHeader');
          const body = document.getElementById('tableBody');

          let max = 0;
          let playerWin = null;
          Object.entries(punteggi).forEach(([playerId, listaPunti]) => {
            let counter = 0;
            // Ora listaPunti è un array, quindi puoi usare di nuovo forEach!
            listaPunti.forEach((punto, index) => {
            counter += punto;
          });
          if ( counter >= max ) {
            max = counter;
            playerWin = playerId
          }
        });
        const winPlayer = players.find(p => p.playerId === playerWin )
        document.getElementById("winner-name").innerHTML =`${winPlayer.playerName}` ;

      // 1. Pulizia
      header.innerHTML = '<th>Round</th>'; 
      body.innerHTML = '';



      // 2. Intestazione: Nomi dei giocatori
      players.forEach(p => {
        const th = document.createElement('th');
        th.textContent = p.playerName;
        header.appendChild(th);
      });

      // 3. Calcoliamo quanti round sono stati fatti (lunghezza del primo array di punteggi)
      // Usiamo l'ID del primo giocatore per capire il numero di round
      const primoPlayerId = players[0].playerId;
      const numeroRound = punteggi[primoPlayerId] ? punteggi[primoPlayerId].length : 0;

    // 4. Creiamo le righe per ogni round
      for (let i = 0; i < numeroRound; i++) {
        const tr = document.createElement('tr');
        
        // Colonna Numero Round
        const tdIndex = document.createElement('td');
        tdIndex.textContent = i + 1;
        tr.appendChild(tdIndex);

        // Colonne Punteggi Giocatori
        players.forEach(p => {
            const tdScore = document.createElement('td');
            // Accediamo all'i-esimo elemento dell'array di quel giocatore
            const score = punteggi[p.playerId][i];
            tdScore.textContent = score !== undefined ? score : '-';
            tr.appendChild(tdScore);
        });

        body.appendChild(tr);
    }

    // 5. RIGA TOTALI (Opzionale ma molto utile)
    const trTotale = document.createElement('tr');
    trTotale.style.background = 'rgba(241, 196, 15, 0.2)'; // Evidenziato oro
    trTotale.innerHTML = '<td><strong>TOT</strong></td>';
    
    players.forEach(p => {
        const tdTotal = document.createElement('td');
        const totale = punteggi[p.playerId].reduce((a, b) => a + b, 0);
        tdTotal.innerHTML = `<strong>${totale}</strong>`;
        trTotale.appendChild(tdTotal);
    });
    body.appendChild(trTotale);
}
    </script>
</body>
</html>
