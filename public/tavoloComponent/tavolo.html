<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Gioco di Carte - Luxury Table</title>
    <link rel="stylesheet" href="/public/tavoloComponent/styleTavolo.css" />
  </head>
  <body>
    <div class="game-container">
      <div class="player opponent" id="opponent-container">
        <div class="hand" id="handOpponent"></div>
      </div>

      <div class="table">
        <div id="table-cards"></div>
      </div>

      <div id="modalPunteggio" class="modal">
        <div class="modal-content">
          <span class="close-btn">&times;</span>
          <div class="table-container">
            <table id="scoreTable">
              <thead>
                <tr id="tableHeader"></tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="player me">
        <div class="controls">
          <button id="btnPunteggio">Punteggio</button>
          <form>
            <input
              id="callInput"
              placeholder="N°"
              pattern="[0-9]"
              type="text"
              inputmode="numeric"
              maxlength="1"
              required
            />
            <button id="callBtn" type="button">Conferma</button>
          </form>
        </div>
        <div class="hand" id="my-hand"></div>
      </div>
    </div>

    <div id="game-log"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <script src="/public/tavoloComponent/scriptTavolo.js"></script>
  </body>
</html>
