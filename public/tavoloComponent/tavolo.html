<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gioco di Carte - Luxury Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/tavoloComponent/styleTavolo.css?v=2.2.0" />
  </head>
  <body>
    <!-- BARRA SUPERIORE HUD -->
    <header class="top-hud">
      <div class="hud-left">
        <div class="hud-pill" id="round-hud">
          <span class="hud-icon">🃏</span>
          <span id="round-text">In attesa...</span>
          <span class="hud-tag" id="round-phase">-</span>
        </div>
      </div>

      <div class="hud-center">
        <div id="turn-banner" class="turn-banner hidden">
          <span id="turn-banner-text">Inizio partita</span>
          <div class="turn-banner-timer" id="turn-banner-timer"></div>
        </div>
      </div>

      <div class="hud-right">
        <button id="btnPunteggio" class="hud-btn" title="Classifica Punteggi">
          <span class="btn-icon">🏆</span>
          <span class="btn-text">Punteggio</span>
        </button>
        <button id="btnToggleLog" class="hud-btn" title="Cronologia Partita">
          <span class="btn-icon">💬</span>
          <span class="btn-text">Registro</span>
          <span id="log-badge" class="badge-dot hidden"></span>
        </button>
      </div>
    </header>

    <!-- AREA DI GIOCO -->
    <main class="game-container" id="gameContainer">
      <!-- AVVERSARI DISPOSTI DINAMICAMENTE -->
      <div id="opponents-layer"></div>

      <!-- TAVOLO DA GIOCO -->
      <div class="table" id="table">
        <!-- Notifiche animate sul feltro verde (prese, chiamate) -->
        <div id="table-toast" class="table-toast hidden"></div>
        
        <!-- Carte giocate al centro del tavolo -->
        <div id="table-cards"></div>
      </div>

      <!-- GIOCATORE LOCALE (ME) -->
      <section class="player me" id="local-player">
        <div class="my-info-bar">
          <div class="player-pill" id="my-pill">
            <span class="dealer-crown hidden" id="my-dealer-badge" title="Sei il Banco">👑 D</span>
            <span class="player-name" id="my-player-name">Tu</span>
            <div class="stats-badge">
              <span title="Prese dichiarate">🎯 <strong id="my-call">-</strong></span>
              <span class="stats-separator">|</span>
              <span title="Prese vinte">🏆 <strong id="my-tricks">0</strong></span>
            </div>
            <!-- Timer a barra per il giocatore locale -->
            <div class="player-timer-bar hidden" id="my-timer-bar"></div>
          </div>
          <!-- Pulsante per riaprire l'overlay di chiamata se minimizzato -->
          <button id="btnOpenBidding" class="btn-open-bidding hidden" type="button" title="Riapri opzioni di chiamata">🎯 Scegli Chiamata</button>
        </div>

        <!-- MANO DEL GIOCATORE -->
        <div class="hand" id="my-hand"></div>
      </section>
    </main>

    <!-- MODALE OVERLAY PER LA CHIAMATA (Bidding UI con pulsanti rapidi) -->
    <div id="biddingOverlay" class="bidding-overlay hidden">
      <div class="bidding-card">
        <button id="btnCloseBidding" class="bidding-close-btn" type="button" title="Riduci e guarda le carte">&times;</button>
        <div class="bidding-header">
          <span class="bidding-icon">🎯</span>
          <h3>Fai la tua Chiamata</h3>
          <p id="bidding-instruction">Quante prese prevedi di fare in questo round?</p>
        </div>
        <div class="bidding-chips" id="biddingChips">
          <!-- I bottoni 0, 1, 2... vengono generati dinamicamente -->
        </div>
        <div id="biddingForbiddenNotice" class="bidding-notice hidden">
          ⚠️ Sei il Banco: il numero <strong id="forbiddenNumber">X</strong> è vietato (la somma delle chiamate non può eguagliare le carte in gioco).
        </div>
        <button id="btnMinimizeBidding" class="bidding-view-cards-btn" type="button">👀 Guarda le tue carte / Riduci</button>
      </div>
    </div>

    <!-- PANNELLO FLOTTANTE / CASSETTO GAME LOG (Chat/Cronologia) -->
    <aside id="game-log-panel" class="game-log-panel closed">
      <div class="log-panel-header">
        <div class="log-panel-title">
          <span>📜 Cronologia Eventi</span>
        </div>
        <button id="btnCloseLog" class="log-close-btn" title="Chiudi">&times;</button>
      </div>
      <div id="game-log" class="game-log-content"></div>
    </aside>

    <!-- MODALE TABELLA PUNTEGGI COMPLETA -->
    <div id="modalPunteggio" class="modal">
      <div class="modal-content table-modal">
        <div class="modal-header">
          <h2>🏆 Tabellone Punteggi</h2>
          <span class="close-btn">&times;</span>
        </div>
        <div class="table-container">
          <table id="scoreTable">
            <thead>
              <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <script src="/public/tavoloComponent/scriptTavolo.js?v=2.2.0"></script>
  </body>
</html>
